<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Trace Notepad</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel-border: #334155;
      --text-main: #f8fafc; --text-muted: #94a3b8;
      --accent-joy: #22c55e; --accent-sadness: #3b82f6;
      --accent-anger: #ef4444; --accent-anxiety: #f59e0b;
      --primary: #6366f1; --primary-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text-main); padding: 2rem 1rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }
    
    .auth-overlay { display: flex; flex-direction: column; gap: 1rem; max-width: 400px; margin: 4rem auto; width: 100%; }
    
    input[type="text"], input[type="password"], textarea {
      width: 100%; background: #0f172a; border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 0.75rem 1rem; color: var(--text-main); font-size: 1rem; outline: none;
    }
    textarea { height: 160px; resize: vertical; }

    header { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.75rem; color: #818cf8; }
    
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .stat-card, .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .value { font-size: 1.5rem; font-weight: 700; }
    
    .breakdown { display: flex; height: 10px; border-radius: 9999px; overflow: hidden; background: #0f172a; }
    .bar-joy { background: var(--accent-joy); } .bar-sadness { background: var(--accent-sadness); }
    .bar-anger { background: var(--accent-anger); } .bar-anxiety { background: var(--accent-anxiety); }
    .legend { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; width: fit-content; }
    .btn:hover { background: var(--primary-hover); }
    .btn-danger { background: #ef4444; padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 4px; border: none; color: #fff; cursor: pointer; }

    .history-list { display: flex; flex-direction: column; gap: 0.85rem; max-height: 400px; overflow-y: auto; margin-top: 0.5rem; }
    .history-card { background: #0f172a; border: 1px solid var(--panel-border); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .history-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); align-items: center; }
    .history-title { font-size: 1.1rem; font-weight: 600; color: #f8fafc; }
    .history-body { font-size: 0.95rem; color: #cbd5e1; white-space: pre-wrap; }
    .history-img {
  max-width: 100%;
  width: auto;
  max-height: 280px;
  object-fit: contain; /* Keeps original proportions without stretching */
  border-radius: 8px;
  margin-top: 0.75rem;
  border: 1px solid var(--panel-border);
  align-self: flex-start; /* Keeps image aligned left instead of stretching across */
}
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="card auth-overlay">
    <h2 id="auth-title">Login to Emotion Trace</h2>
    <input type="text" id="auth-user" placeholder="Username" />
    <input type="password" id="auth-pass" placeholder="Password" />
    <button class="btn" id="auth-submit-btn">Login</button>
    <p style="font-size:0.85rem; color:var(--text-muted); text-align:center;">
      <span id="auth-toggle" style="color:#818cf8; cursor:pointer;">Need an account? Register</span>
    </p>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="hidden" style="display:flex; flex-direction:column; gap:1.5rem;">
    <header>
      <div>
        <h1>Emotion Trace Notepad</h1>
        <p>Logged in as: <b id="user-display" style="color:#818cf8;"></b></p>
      </div>
      <button class="btn-danger" id="logout-btn">Logout</button>
    </header>

    <div class="dashboard">
      <div class="stat-card">
        <span class="label">Primary Emotion</span>
        <span class="value" id="primary-emotion">Neutral 😐</span>
      </div>
      <div class="stat-card">
        <span class="label">Word Count</span>
        <span class="value" id="word-count">0</span>
      </div>
    </div>

    <div class="card">
      <input type="text" id="note-title" placeholder="Note Title..." />
      
      <div class="breakdown">
        <div id="bar-joy" class="bar-joy" style="width: 0%"></div>
        <div id="bar-sadness" class="bar-sadness" style="width: 0%"></div>
        <div id="bar-anger" class="bar-anger" style="width: 0%"></div>
        <div id="bar-anxiety" class="bar-anxiety" style="width: 0%"></div>
      </div>
      <div class="legend">
        <span><span class="dot" style="background: var(--accent-joy);"></span> Joy</span>
        <span><span class="dot" style="background: var(--accent-sadness);"></span> Sadness</span>
        <span><span class="dot" style="background: var(--accent-anger);"></span> Anger</span>
        <span><span class="dot" style="background: var(--accent-anxiety);"></span> Anxiety</span>
      </div>

      <textarea id="note-input" placeholder="Start typing here..."></textarea>
      
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <label style="font-size:0.85rem; color:var(--text-muted);">Attach Picture: </label>
          <input type="file" id="note-image" accept="image/*" style="font-size:0.85rem;" />
        </div>
        <button class="btn" id="save-btn">Save Entry to History</button>
      </div>
    </div>

    <div class="card">
      <h2>Past Entries</h2>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<script>
  // Change from local address to your live Render URL
const BASE_URL = 'https://emotion-trace-backend.onrender.com/api';
  let currentUser = localStorage.getItem('user_token') || null;
  let isRegister = false;

  const emotionLexicon = {
    joy: ['happy', 'great', 'love', 'excited', 'wonderful', 'amazing', 'good', 'peaceful', 'hope', 'proud', 'blessed', 'smile', 'enjoy', 'glad'],
    sadness: ['sad', 'lonely', 'depressed', 'cry', 'grief', 'miss', 'heartbroken', 'hopeless', 'tired', 'hurt', 'miserable', 'gloomy'],
    anger: ['angry', 'hate', 'furious', 'annoyed', 'frustrated', 'rage', 'bitter', 'disgusted', 'upset', 'mad'],
    anxiety: ['worried', 'scared', 'nervous', 'anxious', 'stress', 'afraid', 'panic', 'overwhelmed', 'terrified', 'uneasy']
  };

  const emojiMap = { Joy: 'Joy 😊', Sadness: 'Sadness 😢', Anger: 'Anger 😡', Anxiety: 'Anxiety 😰', Neutral: 'Neutral 😐' };

  const authScreen = document.getElementById('auth-screen');
  const appScreen = document.getElementById('app-screen');
  const authTitle = document.getElementById('auth-title');
  const authUser = document.getElementById('auth-user');
  const authPass = document.getElementById('auth-pass');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authToggle = document.getElementById('auth-toggle');
  const userDisplay = document.getElementById('user-display');
  const logoutBtn = document.getElementById('logout-btn');

  const titleInput = document.getElementById('note-title');
  const textarea = document.getElementById('note-input');
  const imageInput = document.getElementById('note-image');
  const primaryEmotionEl = document.getElementById('primary-emotion');
  const wordCountEl = document.getElementById('word-count');
  const saveBtn = document.getElementById('save-btn');
  const historyList = document.getElementById('history-list');

  let currentEmotion = 'Neutral';

  // AUTH LOGIC
  authToggle.addEventListener('click', () => {
    isRegister = !isRegister;
    authTitle.textContent = isRegister ? 'Register for Emotion Trace' : 'Login to Emotion Trace';
    authSubmitBtn.textContent = isRegister ? 'Register' : 'Login';
    authToggle.textContent = isRegister ? 'Already have an account? Login' : 'Need an account? Register';
  });

  authSubmitBtn.addEventListener('click', async () => {
    const username = authUser.value.trim();
    const password = authPass.value.trim();
    if (!username || !password) return alert('Enter username and password');

    const endpoint = isRegister ? '/register' : '/login';
    try {
      const res = await fetch(BASE_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.detail || 'Authentication failed');

      if (isRegister) {
        alert('Registered! Please log in.');
        authToggle.click();
      } else {
        currentUser = data.token;
        localStorage.setItem('user_token', currentUser);
        initApp();
      }
    } catch (e) {
      alert('Backend connection error');
    }
  });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('user_token');
    currentUser = null;
    appScreen.classList.add('hidden');
    authScreen.classList.remove('hidden');
  });

  function initApp() {
    if (!currentUser) return;
    authScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    userDisplay.textContent = currentUser;
    analyzeText();
    renderHistory();
  }

  // NOTE ACTIONS
  textarea.addEventListener('input', analyzeText);

  saveBtn.addEventListener('click', async () => {
    const textContent = textarea.value.trim();
    if (!textContent) return;

    let imageBase64 = null;
    if (imageInput.files[0]) {
      imageBase64 = await toBase64(imageInput.files[0]);
    }

    try {
      await fetch(BASE_URL + '/notes', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-User': currentUser
        },
        body: JSON.stringify({
          title: titleInput.value.trim(),
          text: textContent,
          emotion: currentEmotion,
          image_base64: imageBase64
        })
      });

      titleInput.value = '';
      textarea.value = '';
      imageInput.value = '';
      analyzeText();
      await renderHistory();
    } catch (e) {
      alert('Failed to save note');
    }
  });

  async function deleteNote(id) {
    try {
      await fetch(`${BASE_URL}/notes/${id}`, {
        method: 'DELETE',
        headers: { 'X-User': currentUser }
      });
      await renderHistory();
    } catch (e) {
      alert('Failed to delete note');
    }
  }

  function analyzeText() {
    const text = textarea.value.toLowerCase();
    const words = text.match(/\b\w+\b/g) || [];
    wordCountEl.textContent = words.length;

    if (words.length === 0) {
      currentEmotion = 'Neutral';
      primaryEmotionEl.textContent = emojiMap.Neutral;
      updateBars({ joy: 0, sadness: 0, anger: 0, anxiety: 0 });
      return;
    }

    let scores = { joy: 0, sadness: 0, anger: 0, anxiety: 0 };
    words.forEach(word => {
      for (const [emotion, wordList] of Object.entries(emotionLexicon)) {
        if (wordList.includes(word)) scores[emotion]++;
      }
    });

    const totalHits = Object.values(scores).reduce((a, b) => a + b, 0);
    let topEmotion = 'Neutral';
    let maxScore = 0;

    for (const [emotion, score] of Object.entries(scores)) {
      if (score > maxScore) {
        maxScore = score;
        topEmotion = emotion.charAt(0).toUpperCase() + emotion.slice(1);
      }
    }

    currentEmotion = topEmotion;
    primaryEmotionEl.textContent = emojiMap[topEmotion] || emojiMap.Neutral;

    if (totalHits > 0) {
      updateBars({
        joy: (scores.joy / totalHits) * 100,
        sadness: (scores.sadness / totalHits) * 100,
        anger: (scores.anger / totalHits) * 100,
        anxiety: (scores.anxiety / totalHits) * 100,
      });
    } else {
      updateBars({ joy: 0, sadness: 0, anger: 0, anxiety: 0 });
    }
  }

  function updateBars(p) {
    document.getElementById('bar-joy').style.width = p.joy + '%';
    document.getElementById('bar-sadness').style.width = p.sadness + '%';
    document.getElementById('bar-anger').style.width = p.anger + '%';
    document.getElementById('bar-anxiety').style.width = p.anxiety + '%';
  }

  async function renderHistory() {
    try {
      const res = await fetch(BASE_URL + '/notes', {
        headers: { 'X-User': currentUser }
      });
      const savedNotes = await res.json();

      if (!savedNotes || savedNotes.length === 0) {
        historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No saved entries yet.</p>';
        return;
      }

      historyList.innerHTML = savedNotes.map(n => `
        <div class="history-card">
          <div class="history-header">
            <div>
              <span class="history-title">${escapeHtml(n.title)}</span>
              <span style="font-size:0.75rem; margin-left:0.5rem; color:var(--text-muted);">${n.date}</span>
            </div>
            <div>
              <span class="emotion-badge">${n.emotion}</span>
              <button class="btn-danger" onclick="deleteNote(${n.id})">Delete</button>
            </div>
          </div>
          <div class="history-body">${escapeHtml(n.text)}</div>
          ${n.image ? `<img src="${n.image}" class="history-img" />` : ''}
        </div>
      `).join('');
    } catch(e) {
      historyList.innerHTML = '<p style="color: red;">Error loading notes.</p>';
    }
  }

  const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  window.addEventListener('DOMContentLoaded', () => {
    if (currentUser) initApp();
  });
</script>
</body>
</html>
